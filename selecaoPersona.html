<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção de Personagem</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 id="tituloSelectPers">Selecione seu Professor:</h1>
    <div id="selecPersonas">
      <button class="escolhaPersona">
        <a class="linkEscolha" href="draPeixoto.html">
          <div class="formatPersona">
            <img
              class="imagemSelec"
              src="src/img/DraPeixoto.jpeg"
              alt="Ilustração da Doutora Peixoto"
            />
            <h2 class="dadosPersona">
              <span class="tituloInfo">Nome: </span>(Dra.) Marília Curie Peixoto
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Sobre: </span>Professora de Catemática na
              Gatec
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Tom: </span>Amigável e prestativa, mas
              rígida
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Comida favorita: </span>Churu de peixe
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Odeia: </span>Água e Ratos
            </h2>
          </div>
        </a>
      </button>
      <button id="botaoComLinha" class="escolhaPersona">
        <a class="linkEscolha" href="mrPlutonio.html">
          <div class="formatPersona">
            <img
              class="imagemSelec"
              src="src/img/MrPlutonio.jpeg"
              alt="Ilustração do Mister Plutonio"
            />
            <h2 class="dadosPersona">
              <span class="tituloInfo">Nome: </span>(Mister) Stuart Smith Bueno
              Plutônio
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Sobre: </span>Magnata herdeiro das
              Industrias Plutônio
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Tom: </span>Esnobe, sério e ganancioso
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Comida favorita: </span>Queijo azul
              Cabrales e Whiskey The Macallan
            </h2>
            <h2 class="dadosPersona">
              <span class="tituloInfo">Odeia: </span>Ratouille
            </h2>
          </div>
        </a>
      </button>
    </div>
  </body>
</html>
